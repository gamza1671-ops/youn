<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비밀번호 변경 · 전국 병원 비급여진료비 조회</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#2563eb;--blue-d:#1d4ed8;--blue-l:#dbeafe;--blue-ll:#eff6ff;
  --gray-50:#f8fafc;--gray-100:#f1f5f9;--gray-200:#e2e8f0;
  --gray-400:#94a3b8;--gray-500:#64748b;--gray-800:#1e293b;
  --green:#059669;--red:#dc2626;--shadow:0 2px 16px rgba(0,0,0,.09);
}
html,body{height:100%}
body{font-family:'Apple SD Gothic Neo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
     background:#f0f4f8;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh}

.card{background:#fff;border-radius:20px;box-shadow:var(--shadow);
      padding:36px 32px;width:100%;max-width:400px}

.card-title{font-size:17px;font-weight:700;color:var(--gray-800);margin-bottom:24px;
            display:flex;align-items:center;gap:8px}

.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--gray-500);margin-bottom:5px}
.field input{width:100%;padding:10px 13px;border:1.5px solid var(--gray-200);
             border-radius:9px;font-size:13px;color:var(--gray-800);
             background:var(--gray-50);outline:none;transition:border-color .2s}
.field input:focus{border-color:var(--blue);background:#fff}

.alert{padding:10px 14px;border-radius:9px;font-size:12px;margin-bottom:16px;text-align:center}
.alert.error{background:#fef2f2;border:1.5px solid #fca5a5;color:var(--red)}
.alert.success{background:#f0fdf4;border:1.5px solid #86efac;color:var(--green)}

.btn-row{display:flex;gap:8px;margin-top:20px}
.btn{flex:1;padding:11px;border:none;border-radius:9px;font-size:13px;
     font-weight:700;cursor:pointer;transition:background .2s}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-d)}
.btn-cancel{background:#fff;border:1.5px solid var(--gray-200);color:var(--gray-600)}
.btn-cancel:hover{background:var(--gray-100)}
</style>
</head>
<body>

<div class="card">
  <div class="card-title">🔐 비밀번호 변경</div>

  {% if error %}
  <div class="alert error">{{ error }}</div>
  {% endif %}
  {% if msg %}
  <div class="alert success">{{ msg }}</div>
  {% endif %}

  <form method="POST">
    <div class="field">
      <label>현재 비밀번호</label>
      <input type="password" name="current" placeholder="현재 비밀번호" autofocus>
    </div>
    <div class="field">
      <label>새 비밀번호</label>
      <input type="password" name="new_pw" placeholder="새 비밀번호 (4자 이상)">
    </div>
    <div class="field">
      <label>새 비밀번호 확인</label>
      <input type="password" name="confirm" placeholder="새 비밀번호 재입력">
    </div>
    <div class="btn-row">
      <a href="/" class="btn btn-cancel" style="text-align:center;text-decoration:none;line-height:1.6">취소</a>
      <button type="submit" class="btn btn-primary">변경</button>
    </div>
  </form>
</div>

</body>
</html>
